
# Magic Pinecone — Coolify / PR Preview Ready

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment:
    POSTGRES_SERVER: db
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    POSTGRES_DB: ${POSTGRES_DB:-magic_pinecone}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    # Optional: live bus arrivals. /transit/bus/* answers 503 while empty.
    TDX_CLIENT_ID: ${TDX_CLIENT_ID:-}
    TDX_CLIENT_SECRET: ${TDX_CLIENT_SECRET:-}
    # Optional: the model that writes answers for /assistant/ask.
    ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
    ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
    ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
    ASSISTANT_REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-}
    ASSISTANT_DISABLE_THINKING: ${ASSISTANT_DISABLE_THINKING:-false}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    KNOWLEDGE_MIN_SIMILARITY: ${KNOWLEDGE_MIN_SIMILARITY:-0.40}
    KNOWLEDGE_CJK_KEYWORD_WEIGHT: ${KNOWLEDGE_CJK_KEYWORD_WEIGHT:-1.0}
    KNOWLEDGE_REFRESH_MINUTES: ${KNOWLEDGE_REFRESH_MINUTES:-60}
    MCP_HTTP_ENABLED: ${MCP_HTTP_ENABLED:-false}
    MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-[]}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-magic_pinecone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Only the web container's nginx can reach this port, so trust its X-Forwarded-* headers
      # (keeps redirects on https instead of http).
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose:
      - "8000"

  worker:
    <<: *backend
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - --loglevel=info

  beat:
    <<: *backend
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-magic_pinecone}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      ENABLE_BEAT: ${ENABLE_BEAT:-false}
    command:
      - sh
      - -c
      - |
        if [ "$$ENABLE_BEAT" = "true" ]; then
          exec celery -A app.core.celery_app beat --loglevel=info
        else
          echo "Celery Beat disabled in this environment"
          exec sleep infinity
        fi
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: web.Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  embedder:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["rag"]
    command:
      - -hf
      - ggml-org/embeddinggemma-300M-GGUF
      - --embeddings
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - -c
      - "2048"
      - -ub
      - "2048"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - llama_cache:/root/.cache/llama.cpp
    expose:
      - "8081"
    restart: unless-stopped

volumes:
  llama_cache:
  postgres_data:
  redis_data:

