
# Magic Pinecone — Coolify / PR Preview Ready

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment:
    POSTGRES_SERVER: db
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    POSTGRES_DB: ${POSTGRES_DB:-magic_pinecone}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    # Point at a shared LibreTranslate to skip the bundled one, e.g. on a server running many previews.
    TRANSLATOR_URL: ${TRANSLATOR_URL:-http://translate:5000}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-magic_pinecone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Only the web container's nginx can reach this port, so trust its X-Forwarded-* headers
      # (keeps redirects on https instead of http).
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose:
      - "8000"

  worker:
    <<: *backend
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - --loglevel=info

  beat:
    <<: *backend
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-magic_pinecone}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      ENABLE_BEAT: ${ENABLE_BEAT:-false}
    command:
      - sh
      - -c
      - |
        if [ "$$ENABLE_BEAT" = "true" ]; then
          exec celery -A app.core.celery_app beat --loglevel=info
        else
          echo "Celery Beat disabled in this environment"
          exec sleep infinity
        fi
    restart: unless-stopped

  # Machine translation on this server: LibreTranslate with Argos Translate's open models. No text leaves the
  # host and there is no rate limit. The API does not wait for it; until it is up, guides stay as written.
  translate:
    image: libretranslate/libretranslate:v1.9.6
    environment:
      # The app's languages: English, Traditional Chinese (zt) and Vietnamese, which pivots through English.
      LT_LOAD_ONLY: en,zt,vi
    volumes:
      # Models are downloaded on first start and kept here.
      - translate_models:/home/libretranslate/.local
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: web.Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  translate_models:

