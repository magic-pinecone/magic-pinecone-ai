server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving "api" per request (via the variable below) instead of once at
    # startup lets nginx boot before the api container and follow it when its IP changes on redeploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # The scraper routes have no authentication, so they stay reachable only inside the compose network.
    location ^~ /api/v1/scraper {
        return 403;
    }

    # ^~ keeps the file-extension location below from capturing /api/v1/openapi.json.
    # proxy_pass has no URI part, so the request path (including /api/v1) is forwarded unchanged.
    location ^~ /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik terminates TLS; pass its scheme through rather than nginx's own "http".
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # FastAPI's interactive docs live outside /api/v1; they load /api/v1/openapi.json same-origin.
    location ~ ^/(docs|redoc)$ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # A missing asset must 404, not come back as index.html with a 200 (breaks .wasm/.js loading).
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
